<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pothole Reporter - Report a Pothole</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            color: #222;
            line-height: 1.6;
        }

        /* ---------- navbar ---------- */
        nav {
            background-color: #1f2937;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        nav .logo span {
            color: #f59e0b;
        }

        nav .links a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav .links a:hover,
        nav .links a.active {
            color: #f59e0b;
        }

        /* ---------- form ---------- */
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .container h1 {
            color: #1f2937;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 20px;
        }

        form {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #f59e0b;
            border-color: #f59e0b;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .error {
            color: #b91c1c;
            font-size: 14px;
            min-height: 20px;
        }

        button {
            background-color: #f59e0b;
            color: #1f2937;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #d98a06;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 6px;
        }

        /* ---------- footer ---------- */
        footer {
            background-color: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">Pothole<span>Reporter</span></a>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="report.html" class="active">Report Pothole</a>
            <a href="myreports.html">My Reports</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Report a Pothole</h1>
        <p class="subtitle">Fill in the details below. Fields marked * are required.</p>

        <form id="reportForm" novalidate>

            <label for="location">Location / Landmark *</label>
            <input type="text" id="location" placeholder="Example: Near Silk Board Junction">
            <p class="error" id="locationError"></p>

            <label for="roadType">Road type</label>
            <select id="roadType">
                <option>Main road</option>
                <option>Side street</option>
                <option>Highway</option>
                <option>Near a school or college</option>
            </select>

            <label for="severity">How bad is it?</label>
            <select id="severity">
                <option value="Minor">Minor - small hole</option>
                <option value="Moderate" selected>Moderate - big hole</option>
                <option value="Dangerous">Dangerous - can cause accidents</option>
            </select>

            <label for="description">Description *</label>
            <textarea id="description"
                placeholder="Example: Large pothole near the bus stop, full of water when it rains."></textarea>
            <p class="error" id="descError"></p>

            <label for="photo">Photo (optional)</label>
            <input type="file" id="photo" accept="image/*">
            <img id="preview" alt="Preview of the photo">
            <p class="error" id="photoError"></p>

            <button type="submit">Submit Report</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Pothole Reporter | Student project</p>
    </footer>

    <script>
        var logoutLink = document.getElementById("logoutLink");

        fetch("/api/me")
            .then(function (res) {
                return res.json();
            })
            .then(function (data) {
                if (data.loggedIn) {
                    logoutLink.textContent = "Logout (" + data.name + ")";
                }
            });

        logoutLink.addEventListener("click", function (event) {
            event.preventDefault();
            fetch("/api/logout", { method: "POST" })
                .then(function () {
                    window.location.href = "login.html";
                });
        });

        var form = document.getElementById("reportForm");
        var photoInput = document.getElementById("photo");
        var preview = document.getElementById("preview");
        var photoData = ""; // the photo is stored as text (base64)

        // show a preview when a photo is chosen
        photoInput.addEventListener("change", function () {
            var file = photoInput.files[0];
            var photoError = document.getElementById("photoError");
            photoError.textContent = "";
            photoData = "";
            preview.style.display = "none";

            if (!file) {
                return;
            }
            if (file.size > 1000000) {
                photoError.textContent = "Photo is too big. Please choose one under 1 MB.";
                photoInput.value = "";
                return;
            }

            var reader = new FileReader();
            reader.onload = function (e) {
                photoData = e.target.result;
                preview.src = photoData;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        // when the form is submitted
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            var place = document.getElementById("location").value.trim();
            var description = document.getElementById("description").value.trim();
            var locationError = document.getElementById("locationError");
            var descError = document.getElementById("descError");
            var isValid = true;

            locationError.textContent = "";
            descError.textContent = "";

            if (place === "") {
                locationError.textContent = "Please enter the location.";
                isValid = false;
            }
            if (description === "") {
                descError.textContent = "Please describe the pothole.";
                isValid = false;
            }
            if (!isValid) {
                return;
            }

            var report = {
                location: place,
                roadType: document.getElementById("roadType").value,
                severity: document.getElementById("severity").value,
                description: description,
                photo: photoData
            };

            // send the report to the server, which saves it in MongoDB
            fetch("/api/reports", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(report)
            })
                .then(function (res) {
                    if (!res.ok) {
                        throw new Error("Server error");
                    }
                    window.location.href = "myreports.html";
                })
                .catch(function () {
                    alert("Could not save the report. Please try again later.");
                });
        });
    </script>

</body>

</html>
